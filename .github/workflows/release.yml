name: Release

on:
  push:
    tags: ["v*"]

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - run: gh release create "$GITHUB_REF_NAME" --repo "$GITHUB_REPOSITORY" --generate-notes
        env:
          GH_TOKEN: ${{ github.token }}

  build:
    needs: release
    strategy:
      matrix:
        include:
          - runner: ubuntu-24.04
            arch: amd64
          - runner: ubuntu-24.04-arm
            arch: arm64
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v7.0.1
      - run: docker build --target test .
      - run: docker build --target package --output type=local,dest=out .
      - run: tar -czf "query_schema-pg18-alpine-${{ matrix.arch }}.tar.gz" -C out .
      - run: gh release upload "$GITHUB_REF_NAME" "query_schema-pg18-alpine-${{ matrix.arch }}.tar.gz" --repo "$GITHUB_REPOSITORY"
        env:
          GH_TOKEN: ${{ github.token }}
